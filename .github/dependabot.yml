# Version updates. Security updates are a separate Dependabot feature and keep
# arriving for every ecosystem in the repository, including the ones left out here.
#
# Left out on purpose until the bindings phase:
#   - criterion in legacy/: dev-only benchmark dependency of the frozen legacy engine.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly, day: monday }
    labels: [dependencies]
    commit-message: { prefix: "chore(deps)" }
    ignore:
      - dependency-name: "criterion"
    groups:
      cargo-minor-patch: { update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /bench
    schedule: { interval: weekly, day: monday }
    labels: [dependencies, "area: bench"]
    commit-message: { prefix: "chore(deps)" }
    groups:
      npm-minor-patch: { update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /website
    schedule: { interval: weekly, day: monday }
    labels: [dependencies, "area: docs"]
    commit-message: { prefix: "chore(deps)" }
    groups:
      npm-minor-patch: { update-types: [minor, patch] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    labels: [dependencies, ci]
    commit-message: { prefix: "ci(deps)" }
    groups:
      actions: { patterns: ["*"] }
