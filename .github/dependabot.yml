version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly, day: monday }
    labels: [dependencies]
    commit-message: { prefix: "chore(deps)" }
    groups:
      cargo-minor-patch: { update-types: [minor, patch] }
  - package-ecosystem: cargo
    directory: /crates/node
    schedule: { interval: weekly, day: monday }
    labels: [dependencies, "area: node"]
    commit-message: { prefix: "chore(deps)" }
    groups:
      cargo-minor-patch: { update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /bench
    schedule: { interval: weekly, day: monday }
    labels: [dependencies, "area: bench"]
    commit-message: { prefix: "chore(deps)" }
    groups:
      npm-minor-patch: { update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /crates/node
    schedule: { interval: weekly, day: monday }
    labels: [dependencies, "area: node"]
    commit-message: { prefix: "chore(deps)" }
    groups:
      npm-minor-patch: { update-types: [minor, patch] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    labels: [dependencies, ci]
    commit-message: { prefix: "ci(deps)" }
    groups:
      actions: { patterns: ["*"] }
