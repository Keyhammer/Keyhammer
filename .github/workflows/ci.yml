name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt -p keyhammer -- --check
      - run: cargo clippy -p keyhammer --all-targets -- -D warnings
      - run: cargo doc -p keyhammer --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: [stable, "1.85"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - run: cargo test -p keyhammer
      - run: cargo test -p keyhammer-legacy
        if: matrix.toolchain == 'stable'

  no-std:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, thumbv7em-none-eabihf
      - run: cargo build -p keyhammer --target wasm32-unknown-unknown --release
      - run: cargo build -p keyhammer --target thumbv7em-none-eabihf

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - run: cargo fmt -p keyhammer-wasm -- --check
      - run: cargo clippy -p keyhammer-wasm --target wasm32-unknown-unknown -- -D warnings
      # Same path remapping as the Pages build; the test fails if the module
      # still contains a build-machine path.
      - run: |
          remap="--remap-path-prefix=${GITHUB_WORKSPACE}=/src"
          remap="$remap --remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}=/cargo"
          remap="$remap --remap-path-prefix=${RUSTUP_HOME:-$HOME/.rustup}=/rustup"
          RUSTFLAGS="$remap" cargo build -p keyhammer-wasm --target wasm32-unknown-unknown --profile wasm
      - run: node bindings/wasm/test.mjs
      # The module the node job below tests on all three platforms.
      - uses: actions/upload-artifact@v4
        with:
          name: keyhammer-wasm
          path: target/wasm32-unknown-unknown/wasm/keyhammer_wasm.wasm
          if-no-files-found: error
          retention-days: 1
      # Size gate: fails if the gzipped module grows past the budget. The
      # budget is 20 KB (20480 bytes) against about 16.7 KB today; to raise it,
      # change WASM_GZIP_BUDGET below in a pull request that says why. The
      # project goal is to stay under 50 KB.
      - name: wasm size gate
        env:
          WASM_GZIP_BUDGET: "20480"
        run: |
          f=target/wasm32-unknown-unknown/wasm/keyhammer_wasm.wasm
          size=$(gzip -9 -n -c "$f" | wc -c)
          echo "gzipped wasm: $size bytes (budget $WASM_GZIP_BUDGET)"
          echo "gzipped wasm: $size bytes (budget $WASM_GZIP_BUDGET)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$size" -gt "$WASM_GZIP_BUDGET" ]; then
            echo "::error::gzipped wasm $size B exceeds budget $WASM_GZIP_BUDGET B; shrink it or raise WASM_GZIP_BUDGET in a PR that says why"
            exit 1
          fi

  # The Node.js package (bindings/node) is JavaScript over the wasm module built
  # above, so it needs no per-platform binary: the same file is tested on
  # Linux, macOS and Windows. Nothing is published.
  node:
    needs: wasm
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 22]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v4
        with:
          name: keyhammer-wasm
          path: bindings/node
      - name: Place the module
        shell: bash
        working-directory: bindings/node
        run: mv keyhammer_wasm.wasm keyhammer.wasm
      - working-directory: bindings/node
        run: npm test
      # The package must contain exactly these files.
      - name: Package contents
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        working-directory: bindings/node
        run: |
          npm pack --dry-run --json | node -e 'const f=JSON.parse(require("fs").readFileSync(0,"utf8"))[0].files.map(x=>x.path).sort().join(","); console.log(f); if (f!=="README.md,index.d.ts,index.js,keyhammer.wasm,package.json") process.exit(1)'
  c-abi:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt -p keyhammer-c -- --check
      - run: cargo clippy -p keyhammer-c --all-targets -- -D warnings
      - run: cargo test -p keyhammer-c
      - run: cargo doc -p keyhammer-c --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      # The header is generated; the committed copy must be current. cbindgen is
      # a build tool only (MPL-2.0), not a dependency of the workspace.
      - name: header is up to date
        if: matrix.os == 'ubuntu-latest'
        working-directory: bindings/c
        run: |
          cargo install cbindgen --version 0.29.4 --locked
          cbindgen --config cbindgen.toml --crate keyhammer-c --output "$RUNNER_TEMP/keyhammer.h"
          diff -u include/keyhammer.h "$RUNNER_TEMP/keyhammer.h" || {
            echo "::error::bindings/c/include/keyhammer.h is stale; regenerate it (see cbindgen.toml)"
            exit 1
          }
      # A real C program against the generated header and the shared library.
      - name: C smoke test
        run: |
          cargo build -p keyhammer-c --release
          lib=$PWD/target/release
          cc -std=c99 -Wall -Wextra -Werror -Ibindings/c/include bindings/c/tests/smoke.c \n            -L"$lib" -lkeyhammer_c -Wl,-rpath,"$lib" -o "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke"
      # The header must also compile as C++ (extern "C" guards, no C-only syntax).
      - name: header compiles as C++
        run: |
          printf '#include "keyhammer.h"
int main() { return kh_abi_version() == KH_ABI_VERSION ? 0 : 1; }
' > "$RUNNER_TEMP/h.cpp"
          c++ -std=c++17 -Wall -Wextra -Werror -Ibindings/c/include -fsyntax-only "$RUNNER_TEMP/h.cpp"

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Pinned to a commit (the v2.1.1 tag), verified with `gh api`.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25
        with:
          command: check

  # The Python binding (bindings/python) is outside the root workspace. Build
  # the abi3 wheel with maturin, install that wheel (not an editable install)
  # and run the tests against it. Nothing is published.
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: bindings/python
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: cargo fmt -- --check
      - run: cargo clippy --locked -- -D warnings
      - run: python -m pip install "maturin==1.15.0" pytest mypy
      - run: maturin build --release --locked --out dist
      - name: Install the wheel and test it
        shell: bash
        run: |
          python -m pip install --no-index --find-links dist keyhammer
          python -m pytest -q tests
          python -m mypy.stubtest --allowlist stubtest-allowlist.txt keyhammer

  bench-competitors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # Stand-alone crate outside the workspace, with its own lockfile.
      - run: cargo check --locked --manifest-path bench/competitors/Cargo.toml

  # Keeps the JavaScript comparison runnable: builds the WebAssembly module, prepares the
  # smallest dictionary and runs a tiny smoke configuration (not the benchmark).
  bench-js-competitors:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: |
          remap="--remap-path-prefix=${GITHUB_WORKSPACE}=/src"
          remap="$remap --remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}=/cargo"
          remap="$remap --remap-path-prefix=${RUSTUP_HOME:-$HOME/.rustup}=/rustup"
          RUSTFLAGS="$remap" cargo build -p keyhammer-wasm --target wasm32-unknown-unknown --profile wasm
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: bench/data
          key: bench-data-${{ hashFiles('bench/fetch-data.mjs', 'bench/prepare-m0-data.mjs') }}
      - name: Prepare the data
        working-directory: bench
        run: |
          npm ci
          node fetch-data.mjs
          node prepare-m0-data.mjs
      - name: Smoke run
        working-directory: bench/js-competitors
        run: |
          npm ci
          node --expose-gc run.mjs --sizes 10000 --corpora birkbeck --queries 20 --repetitions 1 --min-queries 20 --builds 1 --load-runs 2
