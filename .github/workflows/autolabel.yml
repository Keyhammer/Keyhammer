name: autolabel

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

# Never check out pull request code here (see labeler.yml).
permissions:
  contents: read

jobs:
  auto_label:
    permissions:
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter/autolabeler@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
