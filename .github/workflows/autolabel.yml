name: autolabel

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

# Never check out pull request code here (see labeler.yml).
permissions:
  contents: read

jobs:
  auto_label:
    permissions:
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter/autolabeler@72967cdc98ddd3160f1fc3dff619de365e137dd0 # v7.9.0
