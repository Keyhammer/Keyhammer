name: autolabel

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

# Never check out pull request code here (see labeler.yml).
permissions:
  contents: read

jobs:
  auto_label:
    permissions:
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter/autolabeler@d1a19e60e81a7e650d00a7de9277f87e439117ea # v7.11.0
