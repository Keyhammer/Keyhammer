name: labeler

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

# pull_request_target runs the base branch's workflow with a write token, so this
# workflow must never check out or execute code from the pull request.
permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          sync-labels: true
