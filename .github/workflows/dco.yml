name: dco

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every commit needs a Signed-off-by matching its author
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          ACTOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          # Bot accounts (Dependabot, ...) cannot sign off.
          if [[ "$ACTOR" == *"[bot]" ]]; then
            echo "Pull request opened by $ACTOR: skipping the DCO check."
            exit 0
          fi
          fail=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            email=$(git log -1 --format=%ae "$c")
            subject=$(git log -1 --format=%s "$c")
            if ! git log -1 --format=%B "$c" | grep -i '^Signed-off-by:' | grep -iqF "<$email>"; then
              echo "::error::commit ${c:0:7} ($subject) has no 'Signed-off-by: ... <$email>' line. Use 'git commit -s'."
              fail=1
            fi
          done
          exit $fail
