[package]
name = "keyhammer-bench"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
keyhammer = { path = "../crates/keyhammer" }
keyhammer-legacy = { path = "../legacy" }

[features]
# Needs bench/experiments/cost-knobs.patch applied to the core crate (experiment only).
calibration = []

[[bin]]
name = "calib"
path = "src/bin/calib.rs"
required-features = ["calibration"]
