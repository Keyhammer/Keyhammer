# Generates include/keyhammer.h. Run from bindings/c:
#   cbindgen --config cbindgen.toml --crate keyhammer-c --output include/keyhammer.h
# CI regenerates the header and fails if it differs from the committed one.
language = "C"
include_guard = "KEYHAMMER_H"
cpp_compat = true
usize_is_size_t = true
line_endings = "LF"
documentation = true
documentation_style = "c"
header = """/* SPDX-License-Identifier: AGPL-3.0-or-later */
/* Copyright (C) 2026 Robson Trasel */
/* GENERATED by cbindgen from bindings/c/src/lib.rs. Do not edit by hand. */"""

[enum]
prefix_with_name = false

[export]
include = ["kh_status", "kh_config", "kh_entry", "kh_hit", "kh_results"]
